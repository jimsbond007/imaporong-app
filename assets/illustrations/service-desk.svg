  <rect x="34" y="386" width="44" height="50" rx="8" fill="#267653"/>
  <path d="M56 386c-4-24-18-38-34-46M56 386c4-22 18-36 34-44M56 386c-2-26 6-44 16-54" stroke="#75B99B" stroke-width="9" stroke-linecap="round"/>
  <circle cx="22" cy="338" r="12" fill="#75B99B"/>
  <circle cx="92" cy="340" r="12" fill="#75B99B"/>
  <circle cx="74" cy="320" r="10" fill="#75B99B"/>
</svg>
